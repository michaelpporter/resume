name: 'Generate resume'
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v4

      - name: Compile to PDF
        run: |
          mkdir -p public
          typst compile resume.typ public/michaelpporter.pdf --input version=${GITHUB_SHA::7}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: public/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2026-${{ github.run_number }}
          name: Resume v2026-${{ github.run_number }}
          files: public/michaelpporter.pdf
